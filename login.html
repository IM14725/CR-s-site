<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/responsive.css">
    <title>login Page</title>
</head>
<body>
   <section class="container">
      <form action="" method="post" class="formContainer">
        <div class="NITlogo">
           <img src="./assets/image/nit.jpeg" alt="NIT logo">
        </div>
         <h3 id="NIT">NIT Crs Venue Report </h3>

         <div class="formInput">                                                                                
                <label for="regNumber">REG Number: </label>                                                          
                <input type="text" name="regNumber" placeholder="NIT/BIT/..." id="regNumber" class="inputText" required>
         </div>                                                                                                 
        <div class="formInput">                                                                                  
               <label for="password">Password: </label>                                                          
               <input type="password" name="password" placeholder="Enter your password" id="password" class="inputText" required>
               <div class="showPassword">                                                                                
                   <input type="checkbox" name="showPassword" id="showPassword">                                  
                   <label for="showPassword"><small>Show Password</small></label>   
               
        </div>   <br>                                                                                                

          <div class="reportBtnContainer">                           
               <input type="submit" value="Login" class="reportBtn">
          </div>                                                     
      </form>
      </section>


      <script>
            const showPassword = document.querySelector('#showPassword');
            const passwordInput = document.querySelector('#password');
   
            showPassword.addEventListener('change', () => {
               if (showPassword.checked) {
                     passwordInput.type = 'text';
               } else {
                     passwordInput.type = 'password';
               }
            });
      </script>
</body>
</html>
